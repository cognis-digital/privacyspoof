apiVersion: apps/v1
kind: Deployment
metadata: { name: privacyspoof, labels: { app: privacyspoof } }
spec:
  replicas: 1
  selector: { matchLabels: { app: privacyspoof } }
  template:
    metadata: { labels: { app: privacyspoof } }
    spec:
      containers:
        - name: privacyspoof
          image: ghcr.io/cognis-digital/privacyspoof:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: privacyspoof }
spec:
  selector: { app: privacyspoof }
  ports: [{ port: 80, targetPort: 8000 }]
